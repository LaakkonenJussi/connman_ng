name: C/C++ CI

on:
  push:
    branches: ["master", "next"]
  pull_request:
    branches: ["master", "next"]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: builtin-vpn-set
            configure: >-
              ./configure --disable-static
              --enable-ethernet
              --enable-client
              --enable-test
              --enable-openconnect=builtin
              --enable-openvpn=builtin
              --enable-vpnc=builtin
              --enable-l2tp=builtin
              --enable-pptp=builtin
              --enable-loopback=builtin
              --enable-pacrunner=builtin
              --enable-wireguard=builtin
              --with-dns-backend=systemd-resolved
              --enable-systemd
          - name: external-vpn-set
            configure: >-
              ./configure --disable-static
              --enable-ethernet=builtin
              --enable-wifi
              --enable-bluetooth=builtin
              --enable-openconnect
              --enable-openvpn
              --enable-vpnc
              --enable-l2tp
              --enable-pptp
              --enable-wireguard
              --enable-loopback=builtin
              --enable-pacrunner=builtin
              --enable-client
              --enable-test
              --enable-systemd
              --with-firewall=iptables
              --with-dns-backend=systemd-resolved

    name: ${{ matrix.name }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get build-dep -y connman

      - name: Generate autotools files
        run: autoreconf -fi

      - name: Configure build
        run: ${{ matrix.configure }}

      - name: Compile
        run: make -j"$(nproc)"

      - name: Run tests
        run: make check

      - name: Distcheck
        run: make distcheck
